services:
  # ── 1. FastAPI — Backend Recommendation Service ───────────
  virgo-talent-recsys-development:
    image: harbor.cloudias79.com/internal-virgo/virgo-talent-recsys-development:latest
    container_name: virgo-talent-recsys-development
    restart: unless-stopped
    env_file: .env
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./configs:/app/configs
    networks:
      - development

networks:
  development:
    external: true