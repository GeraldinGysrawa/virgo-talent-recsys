services:
  # ── 1. FastAPI — Backend Recommendation Service ───────────
  virgo-talent-recsys-development:
    image: harbor.cloudias79.com/internal-virgo/virgo-talent-recsys-development:latest
    container_name: virgo-talent-recsys-development
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./ontology/ttl:/app/ontology/ttl
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - development

networks:
  development:
    external: true